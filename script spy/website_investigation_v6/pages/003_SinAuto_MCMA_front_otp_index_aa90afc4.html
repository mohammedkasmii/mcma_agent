<html><head><meta charset="UTF-8">


  <title>MAMDA-MCMA | Production</title>
  <link rel="icon" href="/SinAuto_MCMA/public/images/logo-mcma.ico">

  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/plugins/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/plugins/fontawesome/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/plugins/themify-icons/themify-icons.min.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/plugins/animate.css/animate.min.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/css/styles.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/css/plugins.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/css/themes/theme.css">
  <link rel="stylesheet" type="text/css" href="/SinAuto_MCMA/public/css/styles_pers.css">
</head>

<body>
  <div class="row">
    <div class="main-login col-xs-10 col-xs-offset-1 col-sm-8 col-sm-offset-2 col-md-4 col-md-offset-4">
      <div class="box-login" style="margin-top: 20%">
        <form id="otp-form" method="POST" action="/SinAuto_MCMA/front/otp/verify">
          <fieldset class="padding-20">
            <legend class="text-large text-primary">Vérification du code OTP.</legend>
                          <div class="alert alert-success">
                  <p id="msg">OTP généré avec succès</p>
              </div>
            
            <div class="form-group">
              <span class="input-icon">
                <input type="text" class="form-control" id="otp-inp" name="otp-code" placeholder="e.g. 000000" autocomplete="off" required="" minlength="6" maxlength="6">
                <i class="fa fa-lock"></i>
              </span>
            </div>

            <div class="row">
              <button type="submit" class="col-md-3 btn btn-primary pull-right" style="margin-right: 15px">
                Soumettre
                <i class="fa fa-arrow-circle-right"></i>
              </button>

              
                          </div>
          </fieldset>
        </form>
      </div>
    </div>
  </div>


  <script type="text/javascript" src="/SinAuto_MCMA/public/plugins/jquery/jquery.min.js"></script>
  <script type="text/javascript" src="/SinAuto_MCMA/public/plugins/maskedinput/jquery.maskedinput.min.js"></script>

  <script>
  jQuery(document).ready(function () {
    $('#otp-inp').mask('999-999');

    const resendBtn = document.getElementById('resend-btn');
    if (resendBtn) {
      const timeout = setTimeout(() => {
        resendBtn?.classList.remove('hidden');
      }, 120000);

      resendBtn.addEventListener('click', () => {
        resendBtn?.classList.add('hidden');
        clearTimeout(timeout);
      });
    }
  });
  </script>

</body></html>
